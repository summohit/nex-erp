<div class="chart-empty" [style.height.px]="height" *ngIf="isEmpty">
  <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 3v18h18"></path>
    <path d="M18 8l-5 5-3-3-4 4"></path>
  </svg>
  <p class="empty-title">{{ emptyMessage }}</p>
  <p class="empty-hint" *ngIf="emptyHint">{{ emptyHint }}</p>
</div>

<apx-chart
  *ngIf="!isEmpty"
  [series]="series"
  [chart]="chartOptions"
  [xaxis]="type === 'donut' || type === 'radialBar' ? undefined : xaxisOptions"
  [yaxis]="type === 'donut' || type === 'radialBar' ? undefined : yaxisOptions"
  [labels]="type === 'donut' || type === 'radialBar' ? labels : undefined"
  [colors]="colors"
  [dataLabels]="dataLabelsOptions"
  [stroke]="strokeOptions"
  [fill]="fillOptions"
  [legend]="legendOptions"
  [plotOptions]="plotOptionsConfig"
  [grid]="type === 'donut' || type === 'radialBar' ? undefined : gridOptions"
  [tooltip]="tooltipOptions"
  [responsive]="responsiveOptions"
></apx-chart>
