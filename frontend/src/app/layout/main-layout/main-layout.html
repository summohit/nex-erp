@if (onboardingGate()) {
  <!-- Loaded on demand: the gate embeds the full profile page, which is far too
       big to ship to everyone in the first download (16 Nov 2026). -->
  @defer (on immediate) {
    <app-self-onboarding-gate></app-self-onboarding-gate>
  } @loading (minimum 200ms) {
    <div class="gate-loading">Loading your onboarding…</div>
  }
} @else {
<div class="dashboard-layout">
  @if (v2) { <app-sidebar-v2></app-sidebar-v2> } @else { <app-sidebar></app-sidebar> }
  
  <div class="main-content">
    @if (v2) { <app-header-v2></app-header-v2> } @else { <app-header></app-header> }
    
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
  <app-notice-popup></app-notice-popup>
  <app-profile-reminder></app-profile-reminder>
  <app-profile-modal></app-profile-modal>
  <app-chat-message-popup></app-chat-message-popup>
</div>
}
<app-dialog-host></app-dialog-host>
