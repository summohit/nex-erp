<aside class="sidebar" [class.collapsed]="isCollapsed()">
  <div class="sidebar-header">
    <div class="logo-container" *ngIf="!isCollapsed()">
      <img [src]="user()?.company?.logoUrl" 
           *ngIf="user()?.company?.logoUrl && !logoFailed(); else defaultBrand" 
           (error)="onLogoError()" 
           alt="Company Logo" 
           class="logo">
      <ng-template #defaultBrand>
        <div class="logo-badge-full">
          <div class="logo-icon-badge">N</div>
          <span class="logo-text">NEX<span class="logo-highlight">ERP</span></span>
        </div>
      </ng-template>
    </div>
    <button class="btn-collapse" (click)="toggleSidebar()" [attr.title]="isCollapsed() ? 'Expand Sidebar' : 'Collapse Sidebar'">
      <svg lucideChevronRight size="16" *ngIf="isCollapsed()"></svg>
      <svg lucideChevronLeft size="16" *ngIf="!isCollapsed()"></svg>
    </button>
  </div>
  
  <div class="sidebar-scroll">
    <ng-container *ngFor="let section of menuSections; let first = first">
      <ng-container *ngIf="hasVisibleItems(section)">
        <span class="nav-section-title" [class.mt-4]="!first">{{ section.title }}</span>
        <nav class="sidebar-nav">
        <ng-container *ngFor="let item of section.items">
          <div class="nav-section" *ngIf="hasAccess(item.id)">
            <a href="#" 
               class="nav-item" 
               [class.active]="isMainItemActive(item)"
               [class.expanded]="expandedMenu() === item.id"
               (click)="toggleMenu(item.id, $event, !!item.subItems)">
              <div class="active-indicator" *ngIf="isMainItemActive(item)"></div>
              <div class="nav-item-content">
                <ng-container [ngSwitch]="item.icon">
                  <ng-container *ngSwitchCase="'lucideLayoutDashboard'"><svg lucideLayoutDashboard class="nav-icon" size="20"></svg></ng-container>
                  <ng-container *ngSwitchCase="'lucideUsers'"><svg lucideUsers class="nav-icon" size="20"></svg></ng-container>
                  <ng-container *ngSwitchCase="'lucideBriefcase'"><svg lucideBriefcase class="nav-icon" size="20"></svg></ng-container>
                  <ng-container *ngSwitchCase="'lucideCalendarClock'"><svg lucideCalendarClock class="nav-icon" size="20"></svg></ng-container>
                  <ng-container *ngSwitchCase="'lucideTrophy'"><svg lucideTrophy class="nav-icon" size="20"></svg></ng-container>
                  <ng-container *ngSwitchCase="'lucideBanknote'"><svg lucideBanknote class="nav-icon" size="20"></svg></ng-container>
                  <ng-container *ngSwitchCase="'lucideLaptop'"><svg lucideLaptop class="nav-icon" size="20"></svg></ng-container>
                  <ng-container *ngSwitchCase="'lucideSettings'"><svg lucideSettings class="nav-icon" size="20"></svg></ng-container>
                </ng-container>
                <span class="nav-label">{{ item.title }}</span>
              </div>
              <div *ngIf="item.subItems" class="chevron-icon">
                <ng-container *ngIf="expandedMenu() === item.id; else rightChevron">
                  <svg lucideChevronDown size="16"></svg>
                </ng-container>
                <ng-template #rightChevron>
                  <svg lucideChevronRight size="16"></svg>
                </ng-template>
              </div>
            </a>

            <!-- Collapsible Sub-menu with Tree Lines -->
            <div class="sub-nav" [class.open]="expandedMenu() === item.id" *ngIf="item.subItems">
              <div class="tree-line-container">
                <ng-container *ngFor="let sub of item.subItems; let last = last">
                  <div class="sub-nav-item-wrapper" *ngIf="!sub.id || hasAccess(sub.id)">
                    <div class="tree-line" [class.last]="last"></div>
                    <a href="#" class="sub-nav-item" [class.active]="router.url === sub.route" (click)="handleSubMenuClick(sub, $event)">
                      {{ sub.title }}
                    </a>
                  </div>
                </ng-container>
              </div>
            </div>
          </div>
        </ng-container>
        </nav>
      </ng-container>
    </ng-container>
  </div>

  <!-- Sidebar Footer User Profile -->
  <div class="sidebar-footer" *ngIf="user()">
    <div class="user-profile-btn" (click)="goToProfile()" style="display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; overflow: hidden;">
      <ng-container *ngIf="user()?.employee?.avatarUrl; else defaultAvatar">
        <img [src]="user()?.employee?.avatarUrl" alt="User Avatar" class="user-avatar">
      </ng-container>
      <ng-template #defaultAvatar>
        <div class="user-avatar default-avatar">
          <svg lucideUser size="20"></svg>
        </div>
      </ng-template>
      
      <div class="user-info">
        <span class="user-name">{{ user()?.employee?.firstName }} {{ user()?.employee?.lastName }}</span>
        <span class="user-email">{{ user().email }}</span>
      </div>
    </div>
    <button (click)="logout()" class="btn-logout-icon" title="Logout">
      <svg lucideChevronRight size="16"></svg>
    </button>
  </div>
</aside>
