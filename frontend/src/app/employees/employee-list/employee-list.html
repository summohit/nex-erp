<div class="page-container">
  <div class="page-header">
    <div class="header-content">
      <h1>Employee Directory</h1>
      <p>Manage your workforce, assign departments, and configure system access roles.</p>
    </div>
    <div class="header-actions">
      <button class="btn-primary" (click)="openDrawer()" *ngIf="isAdmin()">
        <svg lucidePlus size="16"></svg>
        Add Employee
      </button>
    </div>
  </div>

  <div class="filter-card">
    <div class="filter-group search-group">
      <svg lucideSearch size="16" class="search-icon"></svg>
      <input type="text" placeholder="Search employees by name..." [(ngModel)]="searchText" (input)="onSearch()">
    </div>
    
    <div class="filter-group">
      <select class="form-control" [(ngModel)]="filterDepartmentId" (change)="applyFilters()">
        <option [ngValue]="null">All Departments</option>
        <option *ngFor="let dept of departments()" [ngValue]="dept.id">{{ dept.name }}</option>
      </select>
    </div>

    <div class="filter-group">
      <select class="form-control" [(ngModel)]="filterDesignationId" (change)="applyFilters()">
        <option [ngValue]="null">All Designations</option>
        <option *ngFor="let desig of designations()" [ngValue]="desig.id">{{ desig.name }}</option>
      </select>
    </div>

    <div class="filter-group">
      <select class="form-control" [(ngModel)]="filterRole" (change)="applyFilters()">
        <option [ngValue]="null">All Roles</option>
        <option value="ADMIN">Admin</option>
        <option value="HR">HR</option>
        <option value="FINANCE">Finance</option>
        <option value="EMPLOYEE">Employee</option>
      </select>
    </div>

    <div class="filter-group">
      <select class="form-control" [(ngModel)]="filterOnboardingStatus" (change)="applyFilters()">
        <option [ngValue]="null">All Onboarding Statuses</option>
        <option value="PENDING">Pending</option>
        <option value="IN_PROGRESS">In Progress</option>
        <option value="COMPLETED">Completed</option>
      </select>
    </div>

    <button class="btn-icon" title="Clear Filters" (click)="clearFilters()" *ngIf="searchText || filterDepartmentId || filterDesignationId || filterRole || filterOnboardingStatus">
      <svg lucideX size="16"></svg>
    </button>
  </div>

  <div class="grid-container">
    <ag-grid-angular
      style="width: 100%; height: 100%;"
      class="ag-theme-quartz"
      [rowData]="employees()"
      [columnDefs]="colDefs"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions"
      [pagination]="true"
      [paginationPageSize]="20"
      (gridReady)="onGridReady($event)"
      [theme]="'legacy'">
    </ag-grid-angular>
  </div>
</div>

<app-employee-drawer 
  [isOpen]="isDrawerOpen" 
  [employeeData]="selectedEmployee"
  (closeDrawer)="closeDrawer()"
  (saveSuccess)="onSaveSuccess()">
</app-employee-drawer>
