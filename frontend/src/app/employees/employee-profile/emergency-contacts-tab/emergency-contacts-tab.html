<div class="contacts-tab-container">
  
  <div class="header-actions" *ngIf="canManageContacts">
    <button class="btn-primary" (click)="openModal()">
      <svg lucidePlus size="16"></svg>
      Create New
    </button>
  </div>

  <div class="table-container">
    <ag-grid-angular
      style="width: 100%; height: 100%;"
      class="ag-theme-quartz"
      [theme]="'legacy'"
      [rowData]="employeeData?.emergencyContacts || []"
      [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions"
      [domLayout]="'autoHeight'"
      [pagination]="false"
    >
    </ag-grid-angular>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Add Emergency Contact</h2>
      <button class="close-btn" (click)="closeModal()">✕</button>
    </div>
    
    <div class="modal-body">
      <div class="form-group">
        <label>Name <span class="required">*</span></label>
        <input type="text" class="form-control" [class.is-invalid]="submitted && !newContact.name" [(ngModel)]="newContact.name">
        <div class="error-msg" *ngIf="submitted && !newContact.name">Name is required</div>
      </div>
      
      <div class="form-group">
        <label>Email</label>
        <input type="email" class="form-control" [(ngModel)]="newContact.email">
      </div>
      
      <div class="form-group">
        <label>Mobile <span class="required">*</span></label>
        <input type="text" class="form-control" [class.is-invalid]="submitted && !newContact.mobile" [(ngModel)]="newContact.mobile">
        <div class="error-msg" *ngIf="submitted && !newContact.mobile">Mobile is required</div>
      </div>
      
      <div class="form-group">
        <label>Relationship</label>
        <select class="form-control" [(ngModel)]="newContact.relationship">
          <option value="Father">Father</option>
          <option value="Mother">Mother</option>
          <option value="Spouse">Spouse</option>
          <option value="Brother">Brother</option>
          <option value="Sister">Sister</option>
          <option value="Friend">Friend</option>
        </select>
      </div>
    </div>
    
    <div class="modal-footer">
      <button class="btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn-primary" (click)="saveContact()">Submit</button>
    </div>
  </div>
</div>
