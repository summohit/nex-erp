# Self-hosted Postgres for NEX ERP, replacing Supabase.
# Runs on the same VPS as the backend. Bound to 127.0.0.1 only: never reachable
# from the internet. Connect from your laptop through an SSH tunnel.
services:
  postgres:
    image: postgres:17
    container_name: nex-erp-postgres
    restart: always
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"  # 5432 is taken by the host's own Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - max_connections=100
      - -c
      - shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
