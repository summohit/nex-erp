buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"

        // play-services-location 21.x turned FusedLocationProviderClient from a
        // class into an interface. react-native-geolocation-service is compiled
        // against 18.0.0 and crashes with IncompatibleClassChangeError on 21.x,
        // which react-native-maps otherwise pulls in. 20.0.0 is the last release
        // where it is still a class, so pin every consumer to it.
        googlePlayServicesVersion = "20.0.0"
        playServicesVersion = "20.0.0"
        playServicesLocationVersion = "20.0.0"
        googlePlayServicesLocationVersion = "20.0.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Firebase Cloud Messaging. Only ever APPLIED when google-services.json
        // is present — see app/build.gradle — so a checkout without the file
        // still builds. Having the classpath here is harmless either way.
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"
